<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ff6b4a" />
  <title>What to Eat Today</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <style>
    :root {
      --bg: #f7f7f9;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --primary: #ff6b4a;
      --primary-dark: #e85a3a;
      --green: #34c759;
      --border: #e5e5ea;
    }
    .category-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
    }
    .category-option {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    .category-option input {
      width: auto;
      margin: 0;
      accent-color: var(--primary);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }
    header {
      padding: 18px 20px 10px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 22px; font-weight: 700; }
    header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

    /* Views */
    .view { display: none; padding: 12px 18px; max-width: 480px; margin: 0 auto; }
    .view.active { display: block; }

    /* Filter Chips */
    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 14px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    /* Picker Card */
    .picker-card {
      background: var(--card);
      border-radius: 24px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
      margin: 10px 0 22px;
      min-height: 230px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .emoji { font-size: 54px; margin-bottom: 12px; transition: transform 0.2s; }
    .spinning .emoji { transform: scale(1.15) rotate(12deg); }
    .meal-name { font-size: 26px; font-weight: 800; margin: 0 0 8px; }
    .meal-meta { font-size: 13px; color: var(--muted); }

    /* Buttons */
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    button.primary {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 107, 74, 0.3);
    }
    button.primary:active { background: var(--primary-dark); transform: scale(0.99); }
    button.secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary.locked {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    /* List & Form */
    .add-form {
      background: var(--card);
      padding: 16px;
      border-radius: 18px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row { display: flex; gap: 8px; }
    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      background: var(--bg);
    }
    .list-item {
      background: var(--card);
      padding: 14px 16px;
      border-radius: 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .list-item.muted { opacity: 0.45; }
    .item-info { display: flex; flex-direction: column; gap: 3px; }
    .item-title { font-weight: 600; font-size: 15px; }
    .item-tag { font-size: 12px; color: var(--muted); }
    .item-actions { display: flex; gap: 8px; }
    .icon-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .locked-pick {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .locked-pick-title { font-weight: 600; font-size: 15px; }
    .locked-pick-meta { margin-top: 4px; font-size: 12px; color: var(--muted); }
    .locked-pick-note {
      min-height: 76px;
      margin-top: 12px;
      resize: vertical;
    }

    /* Bottom Tab Bar */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav button {
      flex: 1;
      background: none;
      border: none;
      padding: 12px 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    nav button.active { color: var(--primary); }
  </style>
</head>
<body>

  <header>
    <h1>🍽️ What to Eat</h1>
    <p id="subtitle">No-repeat daily meal picker</p>
  </header>

  <!-- TAB 1: DECIDE -->
  <main id="view-decide" class="view active">
    <div class="chips" id="filter-chips"></div>

    <div class="picker-card" id="picker-card">
      <div class="emoji" id="meal-emoji">🎲</div>
      <div class="meal-name" id="meal-name">Tap Spin to Decide</div>
      <div class="meal-meta" id="meal-meta">Automatically avoids your last 3 meals</div>
    </div>

    <div class="btn-group">
      <button class="primary" id="spin-btn">Spin for a Meal</button>
      <button class="secondary" id="lock-btn" style="display:none;">Lock It In (Won't Repeat Next 3 Picks)</button>
      <button class="secondary" id="copy-btn" style="display:none;">Copy Result to Shrae</button>
    </div>
  </main>

  <!-- TAB 2: MY LIST -->
  <main id="view-list" class="view">
    <form class="add-form" id="add-form">
      <div class="row">
        <input type="text" id="input-emoji" value="🍜" maxlength="2" style="width: 56px; text-align:center;" />
        <input type="text" id="input-name" placeholder="Restaurant or dish name..." required />
      </div>
      <div class="row" style="align-items: flex-start;">
        <div id="input-category" class="category-picker" aria-label="Select categories"></div>
        <div style="display: flex; gap: 8px;">
          <button type="submit" id="submit-meal" class="primary" style="padding: 11px 18px; white-space: nowrap;">+ Add</button>
          <button type="button" id="cancel-edit" class="secondary" style="display:none; padding: 11px 14px; white-space: nowrap;">Cancel</button>
        </div>
      </div>
    </form>

    <div id="meal-list"></div>
  </main>

  <!-- TAB 3: NOTES -->
  <main id="view-notes" class="view">
    <div id="locked-picks-list"></div>
  </main>

  <nav>
    <button class="active" data-tab="decide">🎲 Decide</button>
    <button data-tab="list">📋 My Spots (<span id="count-badge">0</span>)</button>
    <button data-tab="notes">📝 Notes (<span id="notes-count-badge">0</span>)</button>
  </nav>

  <script>
    const STORAGE_KEY = 'wte_meals_v1';
    const HISTORY_KEY = 'wte_history_v1';
    const LOCKED_PICKS_KEY = 'wte_locked_picks_v1';
    const NO_REPEAT_COUNT = 3;
    const CATEGORIES = ['Quick', 'Healthy', 'Dine-in', 'Comfort', 'Coffee', 'Chinese', 'Brunch', 'Bakery'];

    const normalizeMealCategories = (meal = {}) => {
      const rawCategories = Array.isArray(meal.categories) ? meal.categories : [];
      const singleCategory = typeof meal.category === 'string' && meal.category ? [meal.category] : [];
      const categories = [...rawCategories, ...singleCategory]
        .filter(Boolean)
        .map(category => category === 'Cafe' ? 'Coffee' : category);
      return [...new Set(categories)];
    };

    const getMealCategories = (meal) => normalizeMealCategories(meal);

    const DEFAULT_MEALS = [
      { id: 1, name: 'Grilled Chicken Salad', emoji: '🥗', categories: ['Healthy'], active: true },
      { id: 2, name: 'Poke Bowl', emoji: '🐟', categories: ['Healthy'], active: true },
      { id: 3, name: 'Crispy Chicken Sandwich', emoji: '🍔', categories: ['Quick'], active: true },
      { id: 4, name: 'Ramen / Izakaya', emoji: '🍜', categories: ['Dine-in'], active: true },
      { id: 5, name: 'Steak & Fries', emoji: '🥩', categories: ['Dine-in'], active: true },
      { id: 6, name: 'Tacos / Burrito Bowl', emoji: '🌮', categories: ['Quick'], active: true },
      { id: 7, name: 'Iced Latte & Pastry', emoji: '🥐', categories: ['Coffee'], active: true },
      { id: 8, name: 'Hot Pot / BBQ', emoji: '🍲', categories: ['Comfort'], active: true }
    ];

    let meals = (JSON.parse(localStorage.getItem(STORAGE_KEY)) || DEFAULT_MEALS).map(meal => ({
      ...meal,
      categories: normalizeMealCategories(meal)
    }));
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let lockedPicks = JSON.parse(localStorage.getItem(LOCKED_PICKS_KEY)) || [];
    let selectedCategory = 'All';
    let currentPick = null;
    let editingMealId = null;

    const saveState = () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(meals.map(({ category, ...meal }) => ({
        ...meal,
        categories: getMealCategories(meal)
      }))));
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      localStorage.setItem(LOCKED_PICKS_KEY, JSON.stringify(lockedPicks));
      document.getElementById('count-badge').textContent = meals.filter(m => m.active).length;
      document.getElementById('notes-count-badge').textContent = lockedPicks.length;
    };

    const renderCategoryPicker = (selectedCategories = []) => {
      const container = document.getElementById('input-category');
      container.innerHTML = CATEGORIES.map(category => `
        <label class="category-option">
          <input type="checkbox" value="${category}" ${selectedCategories.includes(category) ? 'checked' : ''} />
          <span>${category}</span>
        </label>
      `).join('');
    };

    const resetMealForm = () => {
      editingMealId = null;
      document.getElementById('input-name').value = '';
      document.getElementById('input-emoji').value = '🍜';
      document.getElementById('submit-meal').textContent = '+ Add';
      document.getElementById('cancel-edit').style.display = 'none';
      renderCategoryPicker();
    };

    // Render Category Filter Chips
    const renderChips = () => {
      const categories = ['All', ...CATEGORIES];
      const container = document.getElementById('filter-chips');
      container.innerHTML = categories.map(cat => `
        <button class="chip ${selectedCategory === cat ? 'active' : ''}" data-cat="${cat}">
          ${cat}
        </button>
      `).join('');

      container.querySelectorAll('.chip').forEach(btn => {
        btn.onclick = () => {
          selectedCategory = btn.dataset.cat;
          renderChips();
        };
      });
    };

    // No-Repeat Randomizer Logic
    const spinMeal = () => {
      let pool = meals.filter(m => m.active && (selectedCategory === 'All' || getMealCategories(m).includes(selectedCategory)));
      if (pool.length === 0) {
        alert('No active spots in this category! Add one or switch filters.');
        return;
      }

      // Filter out recent history unless pool is too small
      const nonRecent = pool.filter(m => !history.slice(-NO_REPEAT_COUNT).includes(m.id));
      const candidates = nonRecent.length > 0 ? nonRecent : pool;

      const card = document.getElementById('picker-card');
      const lockBtn = document.getElementById('lock-btn');
      const copyBtn = document.getElementById('copy-btn');
      card.classList.add('spinning');
      lockBtn.classList.remove('locked');
      lockBtn.disabled = false;
      lockBtn.textContent = "Lock It In (Won't Repeat Next 3 Picks)";

      let ticks = 0;
      const interval = setInterval(() => {
        const temp = candidates[Math.floor(Math.random() * candidates.length)];
        const tempCategories = getMealCategories(temp).join(', ') || 'Uncategorized';
        document.getElementById('meal-emoji').textContent = temp.emoji;
        document.getElementById('meal-name').textContent = temp.name;
        document.getElementById('meal-meta').textContent = tempCategories;
        ticks++;

        if (ticks >= 10) {
          clearInterval(interval);
          card.classList.remove('spinning');
          currentPick = candidates[Math.floor(Math.random() * candidates.length)];
          const currentCategories = getMealCategories(currentPick).join(', ') || 'Uncategorized';
          document.getElementById('meal-emoji').textContent = currentPick.emoji;
          document.getElementById('meal-name').textContent = currentPick.name;
          document.getElementById('meal-meta').textContent = `${currentCategories} • Ready to go`;
          lockBtn.style.display = 'block';
          copyBtn.style.display = 'block';
        }
      }, 65);
    };

    // Lock In Choice (updates history and saved notes)
    document.getElementById('lock-btn').onclick = function() {
      if (!currentPick) return;
      history.push(currentPick.id);
      if (history.length > 10) history.shift();
      lockedPicks.push({
        id: Date.now(),
        mealId: currentPick.id,
        name: currentPick.name,
        emoji: currentPick.emoji,
        categories: getMealCategories(currentPick),
        lockedAt: new Date().toISOString(),
        note: ''
      });
      saveState();
      renderNotes();
      this.classList.add('locked');
      this.disabled = true;
      this.textContent = '✓ Locked In!';
    };

    // Copy to Clipboard for WeChat
    document.getElementById('copy-btn').onclick = function() {
      if (!currentPick) return;
      const categories = getMealCategories(currentPick).join(', ') || 'Uncategorized';
      const text = `Today's pick: ${currentPick.emoji} ${currentPick.name} (${categories}) — sound good?`;
      navigator.clipboard?.writeText(text);
      const original = this.textContent;
      this.textContent = '✓ Copied! Paste in WeChat';
      setTimeout(() => (this.textContent = original), 2000);
    };

    // Render Manage List
    const renderList = () => {
      const container = document.getElementById('meal-list');
      container.innerHTML = meals.map(m => {
        const isRecent = history.slice(-NO_REPEAT_COUNT).includes(m.id);
        const categories = getMealCategories(m);
        return `
          <div class="list-item ${m.active ? '' : 'muted'}">
            <div class="item-info">
              <div class="item-title">${m.emoji} ${m.name}</div>
              <div class="item-tag">${categories.length ? categories.join(', ') : 'Uncategorized'}${isRecent ? ' • Ate recently' : ''}</div>
            </div>
            <div class="item-actions">
              <button class="icon-btn" onclick="editMeal(${m.id})">Edit</button>
              <button class="icon-btn" onclick="toggleMeal(${m.id})">${m.active ? 'Mute' : 'Enable'}</button>
              <button class="icon-btn" onclick="deleteMeal(${m.id})">✕</button>
            </div>
          </div>
        `;
      }).join('');
    };

    const renderNotes = () => {
      const container = document.getElementById('locked-picks-list');
      container.replaceChildren();

      if (lockedPicks.length === 0) {
        container.textContent = 'Locked-in meals will appear here for notes.';
        return;
      }

      [...lockedPicks].reverse().forEach(pick => {
        const card = document.createElement('div');
        card.className = 'locked-pick';

        const title = document.createElement('div');
        title.className = 'locked-pick-title';
        title.textContent = `${pick.emoji} ${pick.name}`;

        const meta = document.createElement('div');
        meta.className = 'locked-pick-meta';
        const categories = pick.categories.join(', ') || 'Uncategorized';
        meta.textContent = `${new Date(pick.lockedAt).toLocaleString()} • ${categories}`;

        const note = document.createElement('textarea');
        note.className = 'locked-pick-note';
        note.placeholder = 'Add a note...';
        note.setAttribute('aria-label', `Note for ${pick.name}`);
        note.value = pick.note || '';
        note.addEventListener('change', () => {
          lockedPicks = lockedPicks.map(entry => entry.id === pick.id
            ? { ...entry, note: note.value }
            : entry);
          saveState();
        });

        card.append(title, meta, note);
        container.append(card);
      });
    };

    window.toggleMeal = (id) => {
      meals = meals.map(m => m.id === id ? { ...m, active: !m.active } : m);
      saveState();
      renderList();
    };

    window.editMeal = (id) => {
      const meal = meals.find(m => m.id === id);
      if (!meal) return;

      editingMealId = id;
      document.getElementById('input-name').value = meal.name;
      document.getElementById('input-emoji').value = meal.emoji;
      renderCategoryPicker(getMealCategories(meal));
      document.getElementById('submit-meal').textContent = 'Save changes';
      document.getElementById('cancel-edit').style.display = 'block';
      document.getElementById('input-name').focus();
    };

    window.deleteMeal = (id) => {
      meals = meals.filter(m => m.id !== id);
      if (editingMealId === id) resetMealForm();
      saveState();
      renderList();
    };

    document.getElementById('cancel-edit').onclick = resetMealForm;

    // Add New Meal
    document.getElementById('add-form').onsubmit = (e) => {
      e.preventDefault();
      const name = document.getElementById('input-name').value.trim();
      const emoji = document.getElementById('input-emoji').value.trim() || '🍽️';
      const categories = [...document.querySelectorAll('#input-category input:checked')].map(el => el.value);
      if (!name || categories.length === 0) {
        if (categories.length === 0) alert('Choose at least one category.');
        return;
      }

      if (editingMealId !== null) {
        meals = meals.map(meal => meal.id === editingMealId
          ? { ...meal, name, emoji, categories }
          : meal);
      } else {
        meals.unshift({ id: Date.now(), name, emoji, categories, active: true });
      }

      resetMealForm();
      saveState();
      renderList();
    };

    // Navigation Tabs
    document.querySelectorAll('nav button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`view-${btn.dataset.tab}`).classList.add('active');
        if (btn.dataset.tab === 'list') renderList();
        if (btn.dataset.tab === 'notes') renderNotes();
      };
    });

    document.getElementById('spin-btn').onclick = spinMeal;

    // Register Service Worker for Offline PWA Support
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    saveState();
    renderCategoryPicker();
    renderChips();
  </script>
</body>
</html>
