<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ff6b4a" />
  <title>What to Eat Today</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <style>
    :root {
      --bg: #f7f7f9;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --primary: #ff6b4a;
      --primary-dark: #e85a3a;
      --green: #34c759;
      --border: #e5e5ea;
    }
    .category-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
    }
    .category-option {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    .category-option input {
      width: auto;
      margin: 0;
      accent-color: var(--primary);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }
    header {
      padding: 18px 20px 10px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 22px; font-weight: 700; }
    header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

    /* Views */
    .view { display: none; padding: 12px 18px; max-width: 480px; margin: 0 auto; }
    .view.active { display: block; }

    /* Filter Chips */
    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 14px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    /* Picker Card */
    .picker-card {
      background: var(--card);
      border-radius: 24px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
      margin: 10px 0 22px;
      min-height: 230px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .emoji { font-size: 54px; margin-bottom: 12px; transition: transform 0.2s; }
    .spinning .emoji { transform: scale(1.15) rotate(12deg); }
    .meal-name { font-size: 26px; font-weight: 800; margin: 0 0 8px; }
    .meal-meta { font-size: 13px; color: var(--muted); }

    /* Buttons */
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    button.primary {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 107, 74, 0.3);
    }
    button.primary:active { background: var(--primary-dark); transform: scale(0.99); }
    button.secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary.locked {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    /* List & Form */
    .add-form {
      background: var(--card);
      padding: 16px;
      border-radius: 18px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row { display: flex; gap: 8px; }
    .form-actions { display: flex; gap: 8px; width: 100%; }
    .form-actions .primary { flex: 1; padding: 11px 18px; white-space: nowrap; }
    .form-actions .secondary { padding: 11px 14px; white-space: nowrap; }
    .manual-note-form .row { align-items: center; }
    .manual-note-search { position: relative; flex: 1; min-width: 0; }
    .manual-note-search input { width: 100%; }
    .manual-note-results {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      z-index: 10;
      max-height: 240px;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }
    .manual-note-result {
      display: block;
      width: 100%;
      padding: 11px 12px;
      border: 0;
      border-radius: 0;
      background: transparent;
      text-align: left;
      font-size: 14px;
      cursor: pointer;
    }
    .manual-note-result:hover, .manual-note-result:focus {
      background: var(--bg);
      outline: none;
    }
    .manual-note-empty {
      padding: 11px 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .manual-note-form .primary { padding: 11px 18px; white-space: nowrap; }
    .share-list-action { margin: -6px 0 18px; }
    .share-list-action button { width: 100%; }
    .shared-list-panel {
      max-width: 480px;
      margin: 12px auto;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
    }
    .shared-list-panel h2 { margin: 0 0 6px; font-size: 18px; }
    .shared-list-panel p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    .shared-list-items { max-height: 240px; overflow-y: auto; margin-bottom: 12px; }
    .shared-list-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid var(--border);
      cursor: pointer;
    }
    .shared-list-item input { width: auto; margin: 0; flex: 0 0 auto; accent-color: var(--primary); }
    .shared-list-item-info { min-width: 0; }
    .shared-list-item .item-title { font-size: 14px; }
    .shared-list-name-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .duplicate-tag {
      padding: 2px 6px;
      border-radius: 6px;
      background: #fff1e8;
      color: #a84320;
      font-size: 10px;
      font-weight: 700;
    }
    .shared-list-actions { display: flex; gap: 8px; }
    .shared-list-actions button { flex: 1; padding: 11px 12px; }
    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      background: var(--bg);
    }
    .list-item {
      background: var(--card);
      padding: 14px 16px;
      border-radius: 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .list-item.muted { opacity: 0.45; }
    .item-info { display: flex; flex-direction: column; gap: 3px; }
    .item-title { font-weight: 600; font-size: 15px; }
    .item-tag { font-size: 12px; color: var(--muted); }
    .item-actions { display: flex; gap: 8px; }
    .icon-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    /* Bottom Tab Bar */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav button {
      flex: 1;
      background: none;
      border: none;
      padding: 12px 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    nav button.active { color: var(--primary); }
  </style>
</head>
<body>

  <header>
    <h1>🍽️ What to Eat</h1>
    <p id="subtitle">No-repeat daily meal picker</p>
  </header>

  <section id="shared-list-panel" class="shared-list-panel" aria-labelledby="shared-list-title" hidden>
    <h2 id="shared-list-title">Shared My Spots</h2>
    <p id="shared-list-description"></p>
    <div id="shared-list-items" class="shared-list-items"></div>
    <div class="shared-list-actions">
      <button type="button" class="primary" id="import-shared-list-btn" disabled>Import selected (0)</button>
      <button type="button" class="secondary" id="dismiss-shared-list-btn">Not now</button>
    </div>
  </section>

  <!-- TAB 1: DECIDE -->
  <main id="view-decide" class="view active">
    <div class="chips" id="filter-chips"></div>

    <div class="picker-card" id="picker-card">
      <div class="emoji" id="meal-emoji">🎲</div>
      <div class="meal-name" id="meal-name">Tap Spin to Decide</div>
      <div class="meal-meta" id="meal-meta">Automatically avoids your last 3 meals</div>
    </div>

    <div class="btn-group">
      <button class="primary" id="spin-btn">Spin for a Meal</button>
      <button class="secondary" id="try-new-btn">Try Something New</button>
      <button class="secondary" id="lock-btn" style="display:none;">Lock It In (Won't Repeat Next 3 Picks)</button>
      <button class="secondary" id="copy-btn" style="display:none;">Copy Result to Share</button>
    </div>
  </main>

  <!-- TAB 2: EXPLORE -->
  <main id="view-explore" class="view">
    <form class="add-form" id="explore-add-form">
      <div class="row">
        <input type="text" id="explore-input-emoji" value="🍜" maxlength="2" style="width: 56px; text-align:center;" />
        <input type="text" id="explore-input-name" placeholder="Restaurant or dish name..." required />
      </div>
      <div class="row">
        <div id="explore-input-category" class="category-picker" aria-label="Select categories"></div>
      </div>
      <div class="form-actions">
        <button type="submit" id="explore-submit-meal" class="primary">+ Add</button>
        <button type="button" id="explore-cancel-edit" class="secondary" style="display:none;">Cancel</button>
      </div>
    </form>

    <div class="share-list-action">
      <button type="button" class="secondary" id="share-explore-btn">Export and Share List</button>
    </div>
    <div id="explore-meal-list"></div>
  </main>

  <!-- TAB 3: MY LIST -->
  <main id="view-list" class="view">
    <form class="add-form" id="add-form">
      <div class="row">
        <input type="text" id="input-emoji" value="🍜" maxlength="2" style="width: 56px; text-align:center;" />
        <input type="text" id="input-name" placeholder="Restaurant or dish name..." required />
      </div>
      <div class="row">
        <div id="input-category" class="category-picker" aria-label="Select categories"></div>
      </div>
      <div class="form-actions">
        <button type="submit" id="submit-meal" class="primary">+ Add</button>
        <button type="button" id="cancel-edit" class="secondary" style="display:none;">Cancel</button>
      </div>
    </form>

    <div class="share-list-action">
      <button type="button" class="secondary" id="share-list-btn">Export and Share List</button>
    </div>
    <div id="meal-list"></div>
  </main>

  <!-- TAB 4: NOTES -->
  <main id="view-notes" class="view">
    <form class="add-form manual-note-form" id="manual-note-form">
      <div class="row">
        <div class="manual-note-search">
          <input type="search" id="manual-note-search" placeholder="Search saved spots..." aria-label="Search saved spots" aria-controls="manual-note-results" aria-expanded="false" autocomplete="off" required />
          <input type="hidden" id="manual-note-meal" />
          <div id="manual-note-results" class="manual-note-results" role="listbox" hidden></div>
        </div>
        <button type="submit" class="primary">Add</button>
      </div>
    </form>
    <div id="locked-picks-list"></div>
  </main>

  <nav>
    <button class="active" data-tab="decide">🎲 Decide</button>
    <button data-tab="explore">🧭 Explore</button>
    <button data-tab="list">📋 My Spots</button>
    <button data-tab="notes">📝 Notes</button>
  </nav>

  <script>
    const STORAGE_KEY = 'wte_meals_v1';
    const EXPLORE_STORAGE_KEY = 'wte_explore_meals_v1';
    const HISTORY_KEY = 'wte_history_v1';
    const EXPLORE_HISTORY_KEY = 'wte_explore_history_v1';
    const LOCKED_PICKS_KEY = 'wte_locked_picks_v1';
    const NO_REPEAT_COUNT = 3;
    const CATEGORIES = ['Quick', 'Healthy', 'Dine-in', 'Comfort', 'Coffee', 'Chinese', 'Brunch', 'Bakery'];

    const normalizeMealCategories = (meal = {}) => {
      const rawCategories = Array.isArray(meal.categories) ? meal.categories : [];
      const singleCategory = typeof meal.category === 'string' && meal.category ? [meal.category] : [];
      const categories = [...rawCategories, ...singleCategory]
        .filter(Boolean)
        .map(category => category === 'Cafe' ? 'Coffee' : category);
      return [...new Set(categories)];
    };

    const getMealCategories = (meal) => normalizeMealCategories(meal);

    const encodeBase64Url = bytes => {
      let binary = '';
      for (let offset = 0; offset < bytes.length; offset += 0x8000) {
        binary += String.fromCharCode(...bytes.subarray(offset, offset + 0x8000));
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    };

    const decodeBase64Url = value => {
      const base64 = value.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(value.length / 4) * 4, '=');
      const binary = atob(base64);
      return Uint8Array.from(binary, character => character.charCodeAt(0));
    };

    const readStreamBytes = async (stream, maxBytes = 1_000_000) => {
      const reader = stream.getReader();
      const chunks = [];
      let totalBytes = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        totalBytes += value.byteLength;
        if (totalBytes > maxBytes) {
          await reader.cancel();
          throw new Error('Shared list is too large');
        }
        chunks.push(value);
      }

      const result = new Uint8Array(totalBytes);
      let offset = 0;
      chunks.forEach(chunk => {
        result.set(chunk, offset);
        offset += chunk.byteLength;
      });
      return result;
    };

    const encodeSharedMeals = async (mealList, source) => {
      const items = mealList.map(meal => ({
        n: meal.name,
        e: meal.emoji,
        c: getMealCategories(meal),
        a: Boolean(meal.active)
      }));
      if (items.length > 500) throw new Error('A list can contain up to 500 spots.');

      const jsonBytes = new TextEncoder().encode(JSON.stringify({ v: 2, s: source, i: items }));
      let prefix = 'j';
      let bytes = jsonBytes;
      if (typeof CompressionStream === 'function') {
        const compressedStream = new Blob([jsonBytes]).stream().pipeThrough(new CompressionStream('deflate'));
        bytes = await readStreamBytes(compressedStream);
        prefix = 'z';
      }

      const payload = `${prefix}${encodeBase64Url(bytes)}`;
      if (payload.length > 20000) throw new Error('This list is too large to share in a URL.');
      return payload;
    };

    const decodeSharedMeals = async payload => {
      if (!payload || payload.length > 20000) throw new Error('Invalid shared list');
      const prefix = payload[0];
      const encodedBytes = decodeBase64Url(payload.slice(1));
      let jsonBytes = encodedBytes;

      if (prefix === 'z') {
        if (typeof DecompressionStream !== 'function') throw new Error('Compressed links are not supported in this browser.');
        const decompressedStream = new Blob([encodedBytes]).stream().pipeThrough(new DecompressionStream('deflate'));
        jsonBytes = await readStreamBytes(decompressedStream);
      } else if (prefix !== 'j') {
        throw new Error('Unsupported shared list format');
      }

      const sharedData = JSON.parse(new TextDecoder().decode(jsonBytes));
      if (!sharedData || ![1, 2].includes(sharedData.v) ||
          (sharedData.v === 2 && !['spots', 'explore'].includes(sharedData.s)) ||
          !Array.isArray(sharedData.i) || sharedData.i.length === 0 || sharedData.i.length > 500) {
        throw new Error('Invalid shared list');
      }

      const meals = sharedData.i.map(item => {
        if (!item || typeof item.n !== 'string' || !item.n.trim() || item.n.length > 200 ||
            typeof item.e !== 'string' || item.e.length > 16 ||
            !Array.isArray(item.c) || item.c.length > CATEGORIES.length ||
            item.c.some(category => !CATEGORIES.includes(category)) || typeof item.a !== 'boolean') {
          throw new Error('Invalid shared list item');
        }
        return {
          name: item.n.trim(),
          emoji: item.e,
          categories: [...new Set(item.c)],
          active: item.a
        };
      });
      return { source: sharedData.v === 1 ? 'spots' : sharedData.s, meals };
    };

    const LEGACY_DEFAULT_MEALS = [
      { id: 1, name: 'Grilled Chicken Salad', emoji: '🥗', categories: ['Healthy'], active: true },
      { id: 2, name: 'Poke Bowl', emoji: '🐟', categories: ['Healthy'], active: true },
      { id: 3, name: 'Crispy Chicken Sandwich', emoji: '🍔', categories: ['Quick'], active: true },
      { id: 4, name: 'Ramen / Izakaya', emoji: '🍜', categories: ['Dine-in'], active: true },
      { id: 5, name: 'Steak & Fries', emoji: '🥩', categories: ['Dine-in'], active: true },
      { id: 6, name: 'Tacos / Burrito Bowl', emoji: '🌮', categories: ['Quick'], active: true },
      { id: 7, name: 'Iced Latte & Pastry', emoji: '🥐', categories: ['Coffee'], active: true },
      { id: 8, name: 'Hot Pot / BBQ', emoji: '🍲', categories: ['Comfort'], active: true }
    ];

    const DEFAULT_MEALS = [LEGACY_DEFAULT_MEALS[0]];
    const storedMeals = JSON.parse(localStorage.getItem(STORAGE_KEY));
    const isUnchangedLegacyDefaultList = savedMeals =>
      Array.isArray(savedMeals) &&
      savedMeals.length === LEGACY_DEFAULT_MEALS.length &&
      LEGACY_DEFAULT_MEALS.every(defaultMeal => {
        const storedMeal = savedMeals.find(meal => meal.id === defaultMeal.id);
        return storedMeal &&
          storedMeal.name === defaultMeal.name &&
          storedMeal.emoji === defaultMeal.emoji &&
          storedMeal.active === defaultMeal.active &&
          JSON.stringify(normalizeMealCategories(storedMeal)) === JSON.stringify(defaultMeal.categories);
      });
    const hasUnchangedLegacyDefaults = isUnchangedLegacyDefaultList(storedMeals);

    let meals = (hasUnchangedLegacyDefaults ? DEFAULT_MEALS : storedMeals || DEFAULT_MEALS).map(meal => ({
      ...meal,
      categories: normalizeMealCategories(meal)
    }));
    let exploreMeals = (JSON.parse(localStorage.getItem(EXPLORE_STORAGE_KEY)) || []).map(meal => ({
      ...meal,
      categories: normalizeMealCategories(meal)
    }));
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let exploreHistory = JSON.parse(localStorage.getItem(EXPLORE_HISTORY_KEY)) || [];
    let lockedPicks = JSON.parse(localStorage.getItem(LOCKED_PICKS_KEY)) || [];
    let selectedCategory = 'All';
    let currentPick = null;
    let currentPickSource = 'spots';
    let spinInterval = null;
    let editingMeal = null;
    let incomingSharedList = null;

    const saveState = () => {
      const serializeMeals = list => list.map(({ category, ...meal }) => ({
        ...meal,
        categories: getMealCategories(meal)
      }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeMeals(meals)));
      localStorage.setItem(EXPLORE_STORAGE_KEY, JSON.stringify(serializeMeals(exploreMeals)));
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      localStorage.setItem(EXPLORE_HISTORY_KEY, JSON.stringify(exploreHistory));
      localStorage.setItem(LOCKED_PICKS_KEY, JSON.stringify(lockedPicks));
      document.getElementById('share-list-btn').disabled = meals.length === 0;
      document.getElementById('share-explore-btn').disabled = exploreMeals.length === 0;
    };

    const getMeals = source => source === 'explore' ? exploreMeals : meals;
    const setMeals = (source, nextMeals) => {
      if (source === 'explore') exploreMeals = nextMeals;
      else meals = nextMeals;
    };
    const getHistory = source => source === 'explore' ? exploreHistory : history;

    const renderCategoryPicker = (containerId, selectedCategories = []) => {
      const container = document.getElementById(containerId);
      container.innerHTML = CATEGORIES.map(category => `
        <label class="category-option">
          <input type="checkbox" value="${category}" ${selectedCategories.includes(category) ? 'checked' : ''} />
          <span>${category}</span>
        </label>
      `).join('');
    };

    const resetMealForm = (source) => {
      if (editingMeal?.source === source) editingMeal = null;
      const prefix = source === 'explore' ? 'explore-' : '';
      document.getElementById(`${prefix}input-name`).value = '';
      document.getElementById(`${prefix}input-emoji`).value = '🍜';
      document.getElementById(`${prefix}submit-meal`).textContent = '+ Add';
      document.getElementById(`${prefix}cancel-edit`).style.display = 'none';
      renderCategoryPicker(`${prefix}input-category`);
    };

    // Render Category Filter Chips
    const renderChips = () => {
      const categories = ['All', ...CATEGORIES];
      const container = document.getElementById('filter-chips');
      container.innerHTML = categories.map(cat => `
        <button class="chip ${selectedCategory === cat ? 'active' : ''}" data-cat="${cat}">
          ${cat}
        </button>
      `).join('');

      container.querySelectorAll('.chip').forEach(btn => {
        btn.onclick = () => {
          selectedCategory = btn.dataset.cat;
          renderChips();
        };
      });
    };

    // No-Repeat Randomizer Logic
    const spinMeal = (source = 'spots') => {
      const sourceMeals = getMeals(source);
      const sourceHistory = getHistory(source);
      const sourceName = source === 'explore' ? 'Explore' : 'My Spots';
      const pool = sourceMeals.filter(m => m.active && (selectedCategory === 'All' || getMealCategories(m).includes(selectedCategory)));
      if (pool.length === 0) {
        alert(`No active spots in ${sourceName} for this category! Add one or switch filters.`);
        return;
      }

      // Filter out recent history unless pool is too small
      const nonRecent = pool.filter(m => !sourceHistory.slice(-NO_REPEAT_COUNT).includes(m.id));
      const candidates = nonRecent.length > 0 ? nonRecent : pool;

      const card = document.getElementById('picker-card');
      const lockBtn = document.getElementById('lock-btn');
      const copyBtn = document.getElementById('copy-btn');
      const spinButtons = [document.getElementById('spin-btn'), document.getElementById('try-new-btn')];
      if (spinInterval) clearInterval(spinInterval);
      currentPick = null;
      card.classList.add('spinning');
      currentPickSource = source;
      lockBtn.classList.remove('locked');
      lockBtn.disabled = true;
      lockBtn.textContent = "Lock It In (Won't Repeat Next 3 Picks)";
      copyBtn.disabled = true;
      spinButtons.forEach(button => button.disabled = true);

      let ticks = 0;
      spinInterval = setInterval(() => {
        const temp = candidates[Math.floor(Math.random() * candidates.length)];
        const tempCategories = getMealCategories(temp).join(', ') || 'Uncategorized';
        document.getElementById('meal-emoji').textContent = temp.emoji;
        document.getElementById('meal-name').textContent = temp.name;
        document.getElementById('meal-meta').textContent = tempCategories;
        ticks++;

        if (ticks >= 10) {
          clearInterval(spinInterval);
          spinInterval = null;
          card.classList.remove('spinning');
          currentPick = candidates[Math.floor(Math.random() * candidates.length)];
          const currentCategories = getMealCategories(currentPick).join(', ') || 'Uncategorized';
          document.getElementById('meal-emoji').textContent = currentPick.emoji;
          document.getElementById('meal-name').textContent = currentPick.name;
          document.getElementById('meal-meta').textContent = `${currentCategories} • Ready to go`;
          lockBtn.style.display = 'block';
          copyBtn.style.display = 'block';
          lockBtn.disabled = false;
          copyBtn.disabled = false;
          spinButtons.forEach(button => button.disabled = false);
        }
      }, 65);
    };

    // Lock In Choice (updates history and saved notes)
    document.getElementById('lock-btn').onclick = function() {
      if (!currentPick) return;
      const currentHistory = getHistory(currentPickSource);
      currentHistory.push(currentPick.id);
      if (currentHistory.length > 10) currentHistory.shift();
      addLockedPick(currentPick);
      this.classList.add('locked');
      this.disabled = true;
      this.textContent = '✓ Locked In!';
    };

    // Copy to Clipboard for WeChat
    document.getElementById('copy-btn').onclick = function() {
      if (!currentPick) return;
      const categories = getMealCategories(currentPick).join(', ') || 'Uncategorized';
      const text = `Today's pick: ${currentPick.emoji} ${currentPick.name} (${categories}) — sound good?`;
      navigator.clipboard?.writeText(text);
      const original = this.textContent;
      this.textContent = '✓ Copied! Paste in WeChat';
      setTimeout(() => (this.textContent = original), 2000);
    };

    // Render Manage List
    const renderList = (source = 'spots') => {
      const sourceMeals = getMeals(source);
      const sourceHistory = getHistory(source);
      const container = document.getElementById(source === 'explore' ? 'explore-meal-list' : 'meal-list');
      container.innerHTML = sourceMeals.map(m => {
        const isRecent = sourceHistory.slice(-NO_REPEAT_COUNT).includes(m.id);
        const categories = getMealCategories(m);
        return `
          <div class="list-item ${m.active ? '' : 'muted'}">
            <div class="item-info">
              <div class="item-title">${m.emoji} ${m.name}</div>
              <div class="item-tag">${categories.length ? categories.join(', ') : 'Uncategorized'}${isRecent ? ' • Ate recently' : ''}</div>
            </div>
            <div class="item-actions">
              ${source === 'explore' ? `<button class="icon-btn" onclick="markMealTried(${m.id})">Tried!</button>` : ''}
              <button class="icon-btn" onclick="editMeal(${m.id}, '${source}')">Edit</button>
              <button class="icon-btn" onclick="toggleMeal(${m.id}, '${source}')">${m.active ? 'Mute' : 'Enable'}</button>
              <button class="icon-btn" onclick="deleteMeal(${m.id}, '${source}')">✕</button>
            </div>
          </div>
        `;
      }).join('');
    };

    const renderNotes = () => {
      const container = document.getElementById('locked-picks-list');
      container.replaceChildren();

      if (lockedPicks.length === 0) {
        container.textContent = 'Locked-in meals will appear here for notes.';
        return;
      }

      [...lockedPicks].reverse().forEach(pick => {
        const card = document.createElement('div');
        card.className = 'list-item';

        const info = document.createElement('div');
        info.className = 'item-info';

        const title = document.createElement('div');
        title.className = 'item-title';
        title.textContent = `${pick.emoji} ${pick.name}`;

        const meta = document.createElement('div');
        meta.className = 'item-tag';
        const categories = pick.categories.join(', ') || 'Uncategorized';
        const lockedAt = new Date(pick.lockedAt);
        const date = lockedAt.toLocaleDateString('en-US', {
          month: 'numeric',
          day: 'numeric',
          year: 'numeric'
        });
        const time = lockedAt.toLocaleTimeString('en-US', {
          hour: 'numeric',
          minute: '2-digit'
        });
        meta.textContent = `${date} ${time} • ${categories}`;

        const actions = document.createElement('div');
        actions.className = 'item-actions';
        const deleteButton = document.createElement('button');
        deleteButton.className = 'icon-btn';
        deleteButton.textContent = '✕';
        deleteButton.setAttribute('aria-label', `Delete note for ${pick.name}`);
        deleteButton.addEventListener('click', () => {
          lockedPicks = lockedPicks.filter(entry => entry.id !== pick.id);
          saveState();
          renderNotes();
        });

        info.append(title, meta);
        actions.append(deleteButton);
        card.append(info, actions);
        container.append(card);
      });
    };

    const addLockedPick = (meal) => {
      lockedPicks.push({
        id: Date.now(),
        mealId: meal.id,
        name: meal.name,
        emoji: meal.emoji,
        categories: getMealCategories(meal),
        lockedAt: new Date().toISOString()
      });
      saveState();
      renderNotes();
    };

    const renderManualNoteOptions = () => {
      const search = document.getElementById('manual-note-search');
      const selectedMealInput = document.getElementById('manual-note-meal');
      const results = document.getElementById('manual-note-results');
      const selectedMeal = meals.find(meal => String(meal.id) === selectedMealInput.value);
      const query = search.value.trim().toLowerCase();
      const addButton = document.querySelector('#manual-note-form button[type="submit"]');

      if (selectedMeal) {
        search.value = `${selectedMeal.emoji} ${selectedMeal.name}`;
        results.replaceChildren();
        results.hidden = true;
        search.setAttribute('aria-expanded', 'false');
        addButton.disabled = false;
        return;
      }

      if (selectedMealInput.value) {
        selectedMealInput.value = '';
        search.value = '';
      }

      search.disabled = meals.length === 0;
      search.placeholder = meals.length ? 'Search saved spots...' : 'No saved spots yet';
      addButton.disabled = true;
      results.replaceChildren();
      results.hidden = true;
      search.setAttribute('aria-expanded', 'false');

      if (!query) return;

      const matches = meals.filter(meal => `${meal.emoji} ${meal.name}`.toLowerCase().includes(query));
      if (matches.length === 0) {
        const emptyMessage = document.createElement('div');
        emptyMessage.className = 'manual-note-empty';
        emptyMessage.textContent = 'No matching saved spots';
        results.append(emptyMessage);
      } else {
        matches.forEach(meal => {
          const option = document.createElement('button');
          option.type = 'button';
          option.className = 'manual-note-result';
          option.setAttribute('role', 'option');
          option.textContent = `${meal.emoji} ${meal.name}`;
          option.addEventListener('click', () => {
            selectedMealInput.value = String(meal.id);
            search.value = `${meal.emoji} ${meal.name}`;
            results.replaceChildren();
            results.hidden = true;
            search.setAttribute('aria-expanded', 'false');
            addButton.disabled = false;
          });
          results.append(option);
        });
      }
      results.hidden = false;
      search.setAttribute('aria-expanded', 'true');
    };

    const manualNoteSearch = document.getElementById('manual-note-search');
    manualNoteSearch.addEventListener('input', () => {
      document.getElementById('manual-note-meal').value = '';
      renderManualNoteOptions();
    });
    document.addEventListener('click', (event) => {
      if (!manualNoteSearch.parentElement.contains(event.target)) {
        const results = document.getElementById('manual-note-results');
        results.hidden = true;
        manualNoteSearch.setAttribute('aria-expanded', 'false');
      }
    });

    document.getElementById('manual-note-form').onsubmit = (e) => {
      e.preventDefault();
      const selectedMeal = meals.find(meal => String(meal.id) === document.getElementById('manual-note-meal').value);
      if (!selectedMeal) return;

      addLockedPick(selectedMeal);
      e.currentTarget.reset();
      renderManualNoteOptions();
    };

    window.toggleMeal = (id, source = 'spots') => {
      setMeals(source, getMeals(source).map(m => m.id === id ? { ...m, active: !m.active } : m));
      saveState();
      renderList(source);
    };

    window.editMeal = (id, source = 'spots') => {
      const meal = getMeals(source).find(m => m.id === id);
      if (!meal) return;

      if (editingMeal && editingMeal.source !== source) resetMealForm(editingMeal.source);
      const prefix = source === 'explore' ? 'explore-' : '';
      editingMeal = { id, source };
      document.getElementById(`${prefix}input-name`).value = meal.name;
      document.getElementById(`${prefix}input-emoji`).value = meal.emoji;
      renderCategoryPicker(`${prefix}input-category`, getMealCategories(meal));
      document.getElementById(`${prefix}submit-meal`).textContent = 'Save changes';
      document.getElementById(`${prefix}cancel-edit`).style.display = 'block';
      document.getElementById(`${prefix}input-name`).focus();
    };

    window.deleteMeal = (id, source = 'spots') => {
      setMeals(source, getMeals(source).filter(m => m.id !== id));
      if (editingMeal?.source === source && editingMeal.id === id) resetMealForm(source);
      saveState();
      renderList(source);
      if (source === 'spots') renderManualNoteOptions();
    };

    window.markMealTried = (id) => {
      const meal = exploreMeals.find(item => item.id === id);
      if (!meal) return;

      let newId = Date.now();
      while (meals.some(item => item.id === newId)) newId++;
      meals.unshift({ ...meal, id: newId });
      exploreMeals = exploreMeals.filter(item => item.id !== id);
      exploreHistory = exploreHistory.filter(historyId => historyId !== id);
      if (editingMeal?.source === 'explore' && editingMeal.id === id) resetMealForm('explore');
      saveState();
      renderList('explore');
      renderList('spots');
      renderManualNoteOptions();
    };

    document.getElementById('cancel-edit').onclick = () => resetMealForm('spots');
    document.getElementById('explore-cancel-edit').onclick = () => resetMealForm('explore');

    const handleMealSubmit = (e, source) => {
      e.preventDefault();
      const prefix = source === 'explore' ? 'explore-' : '';
      const name = document.getElementById(`${prefix}input-name`).value.trim();
      const emoji = document.getElementById(`${prefix}input-emoji`).value.trim() || '🍽️';
      const categories = [...document.querySelectorAll(`#${prefix}input-category input:checked`)].map(el => el.value);
      if (!name || categories.length === 0) {
        if (categories.length === 0) alert('Choose at least one category.');
        return;
      }

      if (editingMeal?.source === source) {
        setMeals(source, getMeals(source).map(meal => meal.id === editingMeal.id
          ? { ...meal, name, emoji, categories }
          : meal));
      } else {
        setMeals(source, [{ id: Date.now(), name, emoji, categories, active: true }, ...getMeals(source)]);
      }

      resetMealForm(source);
      saveState();
      renderList(source);
      if (source === 'spots') renderManualNoteOptions();
    };

    document.getElementById('add-form').onsubmit = e => handleMealSubmit(e, 'spots');
    document.getElementById('explore-add-form').onsubmit = e => handleMealSubmit(e, 'explore');

    const clearShareHash = () => {
      const url = new URL(window.location.href);
      url.hash = '';
      window.history.replaceState(window.history.state, '', url);
    };

    const renderSharedListPreview = (sharedMeals, source) => {
      const itemsContainer = document.getElementById('shared-list-items');
      const importButton = document.getElementById('import-shared-list-btn');
      const targetName = source === 'explore' ? 'Explore' : 'My Spots';
      itemsContainer.replaceChildren();
      sharedMeals.forEach((meal, index) => {
        const row = document.createElement('label');
        row.className = 'shared-list-item';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'shared-list-item-checkbox';
        checkbox.value = String(index);
        checkbox.setAttribute('aria-label', `Select ${meal.name} to import${meal.duplicate ? `, duplicated in ${targetName}` : ''}`);
        checkbox.addEventListener('change', updateImportSelection);
        const title = document.createElement('div');
        title.className = 'shared-list-item-info';
        const name = document.createElement('div');
        name.className = 'item-title shared-list-name-row';
        const nameText = document.createElement('span');
        nameText.textContent = `${meal.emoji} ${meal.name}`;
        name.append(nameText);
        if (meal.duplicate) {
          const duplicateTag = document.createElement('span');
          duplicateTag.className = 'duplicate-tag';
          duplicateTag.textContent = 'Duplicated';
          name.append(duplicateTag);
        }
        const details = document.createElement('div');
        details.className = 'item-tag';
        details.textContent = `${meal.categories.join(', ') || 'Uncategorized'}${meal.active ? '' : ' • Muted'}`;
        title.append(name, details);
        row.append(checkbox, title);
        itemsContainer.append(row);
      });
      updateImportSelection();
    };

    const updateImportSelection = () => {
      const selectedCount = document.querySelectorAll('#shared-list-items .shared-list-item-checkbox:checked').length;
      const importButton = document.getElementById('import-shared-list-btn');
      importButton.disabled = selectedCount === 0;
      importButton.textContent = `Import selected (${selectedCount})`;
    };

    const loadSharedListFromUrl = async () => {
      const payload = new URLSearchParams(window.location.hash.slice(1)).get('share');
      if (!payload) return;

      const panel = document.getElementById('shared-list-panel');
      const title = document.getElementById('shared-list-title');
      const description = document.getElementById('shared-list-description');
      const importButton = document.getElementById('import-shared-list-btn');
      panel.hidden = false;
      importButton.disabled = true;
      title.textContent = 'Loading shared list...';
      description.textContent = '';

      try {
        const sharedList = await decodeSharedMeals(payload);
        const targetName = sharedList.source === 'explore' ? 'Explore' : 'My Spots';
        const existingNames = new Set(getMeals(sharedList.source).map(meal => meal.name.trim().replace(/\s+/g, ' ').toLowerCase()));
        incomingSharedList = {
          ...sharedList,
          meals: sharedList.meals.map(meal => ({
            ...meal,
            duplicate: existingNames.has(meal.name.trim().replace(/\s+/g, ' ').toLowerCase())
          }))
        };
        title.textContent = `Shared ${targetName}`;
        const duplicateCount = incomingSharedList.meals.filter(meal => meal.duplicate).length;
        const duplicateNote = duplicateCount
          ? ` ${duplicateCount} potential duplicate${duplicateCount === 1 ? '' : 's'} marked as Duplicated.`
          : '';
        description.textContent = `Select the items you want to import.${duplicateNote} Importing adds them without replacing your existing ${targetName}.`;
        renderSharedListPreview(incomingSharedList.meals, sharedList.source);
      } catch (error) {
        console.error('Unable to load shared list:', error);
        incomingSharedList = null;
        title.textContent = 'Could not open shared list';
        description.textContent = error.message === 'Compressed links are not supported in this browser.'
          ? error.message
          : 'This link is invalid or too large. Ask your friend to create a new share link.';
        document.getElementById('shared-list-items').replaceChildren();
        importButton.textContent = 'Import selected (0)';
      }
    };

    const shareList = async source => {
      try {
        const shareButton = document.getElementById(source === 'explore' ? 'share-explore-btn' : 'share-list-btn');
        const payload = await encodeSharedMeals(getMeals(source), source);
        const shareUrl = new URL(window.location.href);
        shareUrl.hash = `share=${payload}`;
        const shareUrlText = shareUrl.toString();

        if (navigator.clipboard?.writeText) {
          try {
            await navigator.clipboard.writeText(shareUrlText);
            shareButton.textContent = '✓ Link copied!';
            setTimeout(() => {
              shareButton.textContent = 'Export and Share List';
            }, 2000);
            return;
          } catch (error) {
            console.error('Unable to copy share link:', error);
          }
        }
        window.prompt('Copy and share this link:', shareUrlText);
      } catch (error) {
        console.error('Unable to create share link:', error);
        alert(error.message || 'Unable to create share link.');
      }
    };

    document.getElementById('share-list-btn').onclick = () => shareList('spots');
    document.getElementById('share-explore-btn').onclick = () => shareList('explore');

    document.getElementById('import-shared-list-btn').onclick = () => {
      if (!incomingSharedList) return;

      const selectedIndexes = [...document.querySelectorAll('#shared-list-items .shared-list-item-checkbox:checked')]
        .map(checkbox => Number(checkbox.value));
      if (selectedIndexes.length === 0) return;

      const selectedMeals = selectedIndexes.map(index => incomingSharedList.meals[index]).filter(Boolean);
      const source = incomingSharedList.source;
      const targetMeals = getMeals(source);
      const usedIds = new Set(targetMeals.map(meal => meal.id));
      let nextId = Date.now();
      const importedMeals = selectedMeals.map(meal => {
        while (usedIds.has(nextId)) nextId++;
        const imported = {
          id: nextId,
          name: meal.name,
          emoji: meal.emoji,
          categories: meal.categories,
          active: meal.active
        };
        usedIds.add(nextId);
        nextId++;
        return imported;
      });
      setMeals(source, [...importedMeals, ...targetMeals]);
      saveState();
      renderList(source);
      incomingSharedList = null;
      document.getElementById('shared-list-panel').hidden = true;
      clearShareHash();
      document.querySelector(`nav button[data-tab="${source === 'explore' ? 'explore' : 'list'}"]`).click();
    };

    document.getElementById('dismiss-shared-list-btn').onclick = () => {
      incomingSharedList = null;
      document.getElementById('shared-list-panel').hidden = true;
      clearShareHash();
    };

    // Navigation Tabs
    document.querySelectorAll('nav button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`view-${btn.dataset.tab}`).classList.add('active');
        if (btn.dataset.tab === 'list') renderList('spots');
        if (btn.dataset.tab === 'explore') renderList('explore');
        if (btn.dataset.tab === 'notes') renderNotes();
      };
    });

    document.getElementById('spin-btn').onclick = () => spinMeal('spots');
    document.getElementById('try-new-btn').onclick = () => spinMeal('explore');

    // Register Service Worker for Offline PWA Support
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    saveState();
    renderCategoryPicker('input-category');
    renderCategoryPicker('explore-input-category');
    renderManualNoteOptions();
    renderChips();
    loadSharedListFromUrl();
  </script>
</body>
</html>
